<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XenSite plush test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-hi:#79c4ff;
    --blue:#1f5fe0;
    --blue-deep:#0a2f7a;
    --ink:#0b1229;
    --paper:#eef3ff;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:"Nunito",system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 50% 0%, #14204a 0%, var(--ink) 62%),
      var(--ink);
    color:var(--paper);
    min-height:100%;
  }
  main{
    min-height:100vh;
    display:grid;
    grid-template-columns:1.15fr 1fr;
    align-items:center;
    gap:24px;
    max-width:1280px;
    margin:0 auto;
    padding:32px 20px;
  }
  @media (max-width:900px){
    main{ grid-template-columns:1fr; gap:12px; padding-top:20px; }
  }
  .stage{
    position:relative;
    min-height:480px;
  }
  .stage canvas{
    position:absolute;
    inset:0;
    width:100% !important;
    height:100% !important;
    display:block;
  }
  .webgl-fallback{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .webgl-fallback.show{ display:flex; }
  h1{
    font-family:"Baloo 2",cursive;
    font-size:clamp(22px,3vw,32px);
    font-weight:800;
    letter-spacing:.5px;
  }
  .menu-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .menu-wrap h1{ text-align:center; }
  .note{
    font-size:15px;
    font-weight:600;
    color:#b9c8f2;
    min-height:1.4em;
    text-align:center;
    max-width:340px;
  }

  .board{
    --size:min(460px,88vmin);
    --ring:calc(var(--size) * .30);
    --isize:calc(var(--size) * .24);
    --fring:calc(var(--size) * .42);
    --fsize:calc(var(--size) * .14);
    --hsize:calc(var(--size) * .30);
    position:relative;
    width:var(--size);
    height:var(--size);
    background:radial-gradient(circle at 50% 40%, #16244d, #0b1229 70%);
    border-radius:50%;
    box-shadow:
      inset 0 10px 30px rgba(0,0,0,.55),
      inset 0 -6px 18px rgba(121,196,255,.08),
      0 18px 50px rgba(0,0,0,.5);
  }
  @media (max-width:720px){
    .board{ --size:min(88vw,360px); }
  }

  .bubble{
    position:absolute;
    width:var(--fsize);
    height:var(--fsize);
    border-radius:50%;
  }

  .filler{
    z-index:1;
    pointer-events:none;
    background:
      radial-gradient(circle at 38% 34%, #4d8fe8 0%, #123a96 45%, #071d4d 100%);
    box-shadow:
      inset 0 6px 12px rgba(0,0,0,.65),
      inset 0 -3px 6px rgba(121,196,255,.25),
      0 1px 2px rgba(0,0,0,.5);
  }
  .filler.f0{ left:calc(50% + var(--fring) * .7071); top:calc(50% - var(--fring) * .7071); }
  .filler.f1{ left:calc(50% + var(--fring) * .7071); top:calc(50% + var(--fring) * .7071); }
  .filler.f2{ left:calc(50% - var(--fring) * .7071); top:calc(50% + var(--fring) * .7071); }
  .filler.f3{ left:calc(50% - var(--fring) * .7071); top:calc(50% - var(--fring) * .7071); }

  .item{
    z-index:2;
    width:var(--isize);
    height:var(--isize);
    transform:translate(-50%,-50%) scale(var(--s));
    transform-origin:center center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
      radial-gradient(circle at 35% 30%, var(--blue-hi) 0%, var(--blue) 55%, var(--blue-deep) 100%);
    box-shadow:
      0 10px 22px rgba(0,0,0,.55),
      inset 0 -8px 14px rgba(10,47,122,.8),
      inset 0 6px 10px rgba(121,196,255,.5),
      0 0 0 6px rgba(7,26,74,.9);
    border:none;
    cursor:pointer;
    transition:
      transform .16s cubic-bezier(.34,1.56,.64,1),
      opacity .2s ease,
      box-shadow .16s ease;
  }
  .item span{
    font-family:"Baloo 2",cursive;
    font-weight:700;
    font-size:calc(var(--isize) * .19);
    line-height:1.05;
    color:#f2f7ff;
    text-shadow:0 1px 2px rgba(7,26,74,.9);
    padding:8%;
    opacity:0;
    transition:opacity .15s ease;
    pointer-events:none;
  }
  .item.i0{ left:50%; top:calc(50% - var(--ring)); --i:0; }
  .item.i1{ left:calc(50% + var(--ring) * .9511); top:calc(50% - var(--ring) * .309); --i:1; }
  .item.i2{ left:calc(50% + var(--ring) * .5878); top:calc(50% + var(--ring) * .809); --i:2; }
  .item.i3{ left:calc(50% - var(--ring) * .5878); top:calc(50% + var(--ring) * .809); --i:3; }
  .item.i4{ left:calc(50% - var(--ring) * .9511); top:calc(50% - var(--ring) * .309); --i:4; }

  .hub{
    z-index:3;
    width:var(--hsize);
    height:var(--hsize);
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(var(--s));
    display:flex;
    align-items:center;
    justify-content:center;
    border:none;
    cursor:pointer;
    background:
      radial-gradient(circle at 35% 30%, var(--blue-hi) 0%, var(--blue) 50%, var(--blue-deep) 100%);
    box-shadow:
      0 12px 26px rgba(0,0,0,.6),
      inset 0 -10px 18px rgba(10,47,122,.9),
      inset 0 8px 12px rgba(121,196,255,.55),
      0 0 0 8px rgba(7,26,74,.9);
    transition:
      transform .16s cubic-bezier(.34,1.56,.64,1),
      box-shadow .16s ease;
  }
  .hub span{
    font-family:"Baloo 2",cursive;
    font-weight:800;
    font-size:calc(var(--hsize) * .16);
    letter-spacing:1px;
    color:#f2f7ff;
    text-shadow:0 1px 3px rgba(7,26,74,.9);
    pointer-events:none;
  }
  .hub:active{ transform:translate(-50%,-50%) scale(.72) !important; }

  .board .item{ --s:.42; opacity:.85; pointer-events:none; }
  .board .item span{ opacity:.4; }
  .board .hub{ --s:.82; }
  .board:not(.open) .hub:hover,
  .board:not(.open) .hub:focus-visible{ --s:.88; }

  .board.open .item{ --s:1; opacity:1; pointer-events:auto; transition-delay:calc(var(--i) * 35ms); }
  .board.open .item span{ opacity:1; }
  .board.open .hub{ --s:.78; }
  .board.open .item:hover,
  .board.open .item:focus-visible{
    --s:.93;
    box-shadow:
      0 6px 14px rgba(0,0,0,.55),
      inset 0 -5px 10px rgba(10,47,122,.7),
      inset 0 5px 8px rgba(121,196,255,.55),
      0 0 0 6px rgba(7,26,74,.9);
  }
  .board.open .item.popped{
    --s:.42;
    background:
      radial-gradient(circle at 38% 36%, #4d8fe8 0%, #123a96 45%, #071d4d 100%);
    box-shadow:
      inset 0 8px 14px rgba(0,0,0,.7),
      inset 0 -4px 8px rgba(121,196,255,.2),
      0 0 0 6px rgba(7,26,74,.9),
      0 1px 3px rgba(0,0,0,.5);
  }
  .board.open .item.popped span{ opacity:.35; }

  @media (prefers-reduced-motion:reduce){
    .item,.hub{ transition-duration:.01s; transition-delay:0s; }
  }
  [hidden], .item[hidden]{display:none!important}
  #fallback:not([hidden]){display:flex}
  .item{text-decoration:none}
  #puppet-button{display:block;margin:0 auto;padding:12px 22px;border:2px solid var(--blue-hi);border-radius:24px;background:var(--blue-deep);color:var(--paper);font:inherit;cursor:pointer}
  #search{width:min(100%,340px)}
  #search label{display:block;margin-bottom:8px}
  #menu-query{width:100%;padding:12px;border:2px solid var(--blue-hi);border-radius:12px;background:var(--ink);color:var(--paper);font:inherit}
  :is(a,button,input):focus-visible{outline:3px solid var(--paper);outline-offset:5px}
  .stage{cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="character"><div class="stage" id="view" role="img" aria-label="Your puppet character">
    <div class="webgl-fallback" id="fallback" hidden>
      <div>
        <h1>XenSite</h1>
        <p style="margin-top:8px;color:#b9c8f2;">Your browser needs WebGL to show the plush puppet. The menu still works on the right.</p>
      </div>
    </div>
  </div>

  <button id="puppet-button" type="button" aria-controls="menu" aria-expanded="false">Open my menu</button></div>
  <div class="menu-wrap">
    <h1>Menu, as a PopIT toy</h1>
    <form id="search" role="search" hidden><label for="menu-query">Search the menu</label><input id="menu-query" type="search" placeholder="Projects, resume, contact…" autocomplete="off" aria-controls="menu"></form>
    <div class="board" id="menu" role="navigation" aria-label="Main menu">
      <button class="hub" id="disc" type="button" aria-controls="menu" aria-expanded="false"><span>MENU</span></button>
      <div class="filler f0" aria-hidden="true"></div>
      <div class="filler f1" aria-hidden="true"></div>
      <div class="filler f2" aria-hidden="true"></div>
      <div class="filler f3" aria-hidden="true"></div>
      <a class="item i0" href="/projects/"><span>Projects</span></a>
      <a class="item i1" href="/"><span>Home</span></a>
      <a class="item i2" href="/Jakes_Portf_09_21_26.pdf"><span>Resume</span></a>
      <a class="item i3" href="/contact/"><span>Contact</span></a>
      <a class="item i4" href="/about/"><span>About</span></a>
    </div>

    <p class="note" id="note" aria-live="polite">Pop the blue button in the middle to open the menu.</p>
  </div>
</main>

<script src="./menu.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="./puppet.js"></script>
</body></html>
